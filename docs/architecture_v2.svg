<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Architecture V2, architecture cible défendable</title>
  <desc id="desc">Entrée configurée vers snapshot raw, validation séparant accepté et rejeté, publication CSV avec observabilité, sauvegardes et reprise.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#34495e"/></marker></defs>
  <rect width="1200" height="560" fill="#f7f8fa"/>
  <text x="48" y="54" font-family="sans-serif" font-size="28" font-weight="700" fill="#18323f">Architecture V2 · cible proportionnée et observable</text>
  <g font-family="sans-serif" text-anchor="middle">
    <g fill="#ffffff" stroke="#31708e" stroke-width="2">
      <rect x="45" y="135" width="170" height="95" rx="6"/><rect x="265" y="135" width="170" height="95" rx="6"/>
      <rect x="485" y="135" width="170" height="95" rx="6"/><rect x="705" y="135" width="170" height="95" rx="6"/>
      <rect x="925" y="135" width="220" height="95" rx="6"/>
    </g>
    <g fill="#18323f" font-size="17" font-weight="700">
      <text x="130" y="172">Source configurable</text><text x="130" y="198" font-size="13">chemin CSV + échantillon</text>
      <text x="350" y="172">Collecte</text><text x="350" y="198" font-size="13">run_id + hash + copie</text>
      <text x="570" y="172">Raw horodaté</text><text x="570" y="198" font-size="13">rejeu / audit local</text>
      <text x="790" y="172">Contrôle</text><text x="790" y="198" font-size="13">profil + contrat + règles</text>
      <text x="1035" y="172">Publication batch</text><text x="1035" y="198" font-size="13">curated CSV + indicateurs</text>
    </g>
    <path d="M215 182 H258 M435 182 H478 M655 182 H698 M875 182 H918" stroke="#34495e" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="720" y="300" width="140" height="74" rx="6" fill="#fff4e5" stroke="#bd6b00" stroke-width="2"/>
    <text x="790" y="331" font-size="17" font-weight="700" fill="#5b3b00">Rejected</text><text x="790" y="354" font-size="13" fill="#5b3b00">motif + compteurs</text>
    <path d="M790 230 V293" stroke="#bd6b00" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="930" y="300" width="210" height="74" rx="6" fill="#eaf5ee" stroke="#357a4b" stroke-width="2"/>
    <text x="1035" y="331" font-size="17" font-weight="700" fill="#19482a">Produit métier</text><text x="1035" y="354" font-size="13" fill="#19482a">dashboard + hotspots</text>
    <path d="M1035 230 V293" stroke="#357a4b" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="150" y="430" width="360" height="78" rx="6" fill="#edf1f4" stroke="#677782" stroke-width="2"/>
    <text x="330" y="462" font-size="17" font-weight="700" fill="#263943">Observabilité</text><text x="330" y="486" font-size="13" fill="#263943">logs + run report + fraîcheur + état</text>
    <rect x="650" y="430" width="360" height="78" rx="6" fill="#edf1f4" stroke="#677782" stroke-width="2"/>
    <text x="830" y="462" font-size="17" font-weight="700" fill="#263943">Reprise contrôlée</text><text x="830" y="486" font-size="13" fill="#263943">incident documenté → correction → rerun</text>
    <path d="M350 230 V282 H330 V423 M790 374 V401 H830 V423 M1035 374 V423" fill="none" stroke="#677782" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
  </g>
  <text x="48" y="540" font-family="sans-serif" font-size="14" fill="#52616b">CSV + batch retenus; SQLite, Warehouse et streaming restent différés jusqu'à un besoin mesurable. Raw exclu de Git.</text>
</svg>