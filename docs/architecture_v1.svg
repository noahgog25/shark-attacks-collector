    <g fill="#ffffff" stroke="#31708e" stroke-width="2">
      <rect x="40" y="145" width="165" height="92" rx="6"/><rect x="245" y="145" width="165" height="92" rx="6"/>
      <rect x="450" y="145" width="165" height="92" rx="6"/><rect x="655" y="145" width="165" height="92" rx="6"/>
