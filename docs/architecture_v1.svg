      <text x="122" y="180">CSV source</text><text x="122" y="205" font-size="13">GSAF / échantillon</text>
      <text x="327" y="180">Collecte</text><text x="327" y="205" font-size="13">copie horodatée</text>
      <text x="532" y="180">Raw</text><text x="532" y="205" font-size="13">preuve + hash</text>
