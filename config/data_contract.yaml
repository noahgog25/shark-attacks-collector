dataset: shark_attacks
version: "1.0"
contract_status: versionne
grain: >
  Une ligne represente un incident d'attaque de requin recense dans le
  Global Shark Attack File, caracterise par sa date, sa localisation,
  l'activite pratiquee au moment des faits et le profil de la victime.
owner: etudiant_eseo
business_key:
  available: false
  strategy: deduplication_stricte_sur_tous_les_champs_source
  limitation: deux_incidents_distincts_identiques_peuvent_etre_fusionnes
collection:
  mode: batch
  frequency: ponctuelle_sur_export_manuel
  raw_copy: snapshot_utc_horodate_non_transforme
  retry: corriger_la_source_puis_relancer_le_pipeline
observability:
  run_id: timestamp_utc_unique
  logs: stdout_stderr_avec_etapes_et_erreurs
  report: reports/interpretation/run_report.json
  metrics:
    - input_rows
    - accepted_rows
    - rejected_rows
    - duplicates_removed
    - duration_seconds
    - newest_record_date
    - data_age_days
  failure_status: FAIL_avec_type_et_message_d_erreur

rgpd:
  register: config/processing_register.yaml
  purpose: analyse descriptive et pedagogique, sans profilage individuel
  minimization: >
    Le champ name reste dans le raw local uniquement et est exclu du curated
    par liste blanche explicite.
  retention: raw_et_rejets_a_supprimer_ou_anonymiser_en_fin_de_projet
  pia: reevaluation_obligatoire_si_le_perimetre_ou_le_risque_change

application:
  user: "Etudiant ou analyste explorant les incidents de requins recenses"
  central_question: >
    Ou, quand et dans quelles conditions environnementales les incidents sont-ils
    declares, et quelles especes sont candidates dans les regions ou une presence
    GBIF est documentee ?
  decision: >
    Prioriser les zones et periodes a examiner et choisir les enrichissements
    ecologiques necessaires pour tester une hypothese.
  kpis:
    - incidents_declares_par_localite_pays_annee
    - incidents_declares_par_mois
    - rapprochements_espece_attaque_a_moins_de_25_et_100_km

raw_schema:
  - {name: date, type: date_text, required: false}
  - {name: year, type: numeric, required: true}
  - {name: type, type: category, required: true}
  - {name: country, type: string, required: true}
  - {name: area, type: string, required: false}
  - {name: location, type: string, required: false}
  - {name: activity, type: string, required: false}
  - {name: name, type: sensitive_string, required: false}
  - {name: sex, type: category, required: false}
  - {name: age, type: text_or_numeric, required: false}

curated_schema:
  - {name: date_complete, type: datetime, nullable: true}
  - {name: annee, type: Int64, nullable: true}
  - {name: pays, type: string, nullable: false}
  - {name: zone, type: string, nullable: true}
  - {name: localite, type: string, nullable: true}
  - {name: activite, type: string, nullable: false}
  - {name: type_attaque, type: category, nullable: false}
  - {name: sexe, type: category, nullable: true}
  - {name: age, type: Int64, nullable: true}
  - {name: tranche_age, type: string, nullable: true}

analysis_scope:
  current_outputs:
    - hotspots_incidents_declares
    - saisonnalite_incidents_declares
    - environmental_enrichment_optional
  interpretation: >
    Ces sorties decrivent les incidents recenses. Elles ne mesurent ni la
    dangerosite intrinseque d'un lieu, ni l'abondance des requins, ni une
    causalite entre reproduction, temperature et agressivite.
  future_external_sources:
    - ocearch_tracks
    - gbif_species_occurrences
    - sea_surface_temperature_and_daily_weather

environmental_enrichment:
  activation: "python -m src.pipeline --enrich"
  incident_identifier: >
    SHA-256 des champs curated, sans champ name; cet identifiant ne remplace
    pas une cle métier naturelle.
  output: data/curated/attacks_enriched.csv
  cache: data/raw/external/
  output_schema:
    - incident_id
    - date
    - latitude
    - longitude
    - geocode_precision
    - hemisphere
    - sst_c
    - sst_clim_c
    - sst_anom_c
    - sst_anom_noaa_c
    - sst_control_mean_c
    - air_tmax_c
    - air_tmax_control_mean_c
    - precip_mm
    - precip_control_mean_mm
    - wind_max_kmh
    - wind_control_mean_kmh
    - precip_3d_mm
    - precip_3d_control_mean_mm
    - gbif_2025_2026_within_100km
    - env_status
  status_values:
    - OK
    - NO_OCEAN_CELL
    - PRE_1982
    - API_FAIL
    - OUTSIDE_OISST_WINDOW
  oisst:
    product: NOAA_OISST_v2.1
    endpoint: "https://coastwatch.pfeg.noaa.gov/erddap"
    dataset: ncdcOisst21Agg_LonPM180
    variables: [sst, anom]
    dimensions: [time, zlev, latitude, longitude]
    grid_resolution_degrees: 0.25
    request_range: "1982-01-01/2023-12-31"
    nearest_ocean_cell_search_degrees: "<0.5"
    local_climatology: "1982-2011, jour de l'annee +/- 15 jours"
  era5:
    product: Open_Meteo_Archive_ERA5
    endpoint: "https://archive-api.open-meteo.com/v1/archive"
    daily_variables:
      - temperature_2m_max
      - precipitation_sum
      - wind_speed_10m_max
    timezone: auto
    wind_speed_unit: kmh
    attribution: "CC BY 4.0"
  eligibility:
    required: [date_exacte, latitude, longitude, type_attaque_non_provoquee_si_disponible]
    exclude_january_first: true
    oisst_from: "1982-01-01"
    era5_from: "1940-01-01"
    controls_per_incident: 10
    control_match: "meme lieu et meme annee, hors date de l'incident"
    random_seed: 20261027
  hypotheses:
    - {id: H1, topic: temperature_sst, comparison: incident_vs_10_controls, status: "Soutenue | Non soutenue | Non concluante"}
    - {id: H2, topic: sst_anomaly_vs_local_climatology, comparison: anomaly_positive, status: "Soutenue | Non soutenue | Non concluante"}
    - {id: H3, topic: human_exposure_proxy, comparison: "air_up_precipitation_down_wind_down", status: "Soutenue | Non soutenue | Non concluante"}
    - {id: H4, topic: gbif_presence_2025_2026, comparison: exploratory_spatial_overlap, status: "Non concluante"}
    - {id: H5, topic: previous_three_day_precipitation, comparison: incident_vs_controls, status: "Soutenue | Non soutenue | Non concluante"}
  interpretation: >
    Les associations sont descriptives et exploratoires. Elles ne démontrent
    aucune cause, aucun niveau de danger, ni l'identité de l'espèce responsable.

source:
  name: "Global Shark Attack File (extrait via Kaggle - dataset 'Shark Attacks')"
  url: "https://www.kaggle.com/datasets/gauravkumar2525/shark-attacks"
  license: "Usage pedagogique - se referer aux conditions d'utilisation Kaggle"
  access_date: "2026-09-22"
  update_frequency: "ponctuelle (pas de garantie de mise a jour, traite en batch)"

required_fields:
  - country
  - year
  - type

quality_rules:
  - name: completude_pays
    description: "Le pays (country) doit etre renseigne."
    action_si_echec: rejeter
  - name: validite_annee
    description: "L'annee (year) doit etre un entier compris entre 1000 et l'annee courante."
    action_si_echec: rejeter
  - name: coherence_type
    description: "Le type d'attaque (type) doit appartenir a la liste des valeurs connues du GSAF."
    action_si_echec: rejeter
  - name: domaine_age
    description: "L'age, s'il est renseigne, doit etre compris entre 0 et 120 ans."
    action_si_echec: "corriger (mis a NULL) sans rejeter la ligne"
  - name: unicite
    description: "Aucune ligne ne doit etre strictement identique a une autre sur l'ensemble des champs source."
    action_si_echec: "dedupliquer, ne garder que la premiere occurrence"
